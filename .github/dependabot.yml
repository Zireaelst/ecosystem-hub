# Patch + minor only, once a week. Majors are done by hand (`pnpm up <pkg>@latest`).
# Security updates bypass this schedule (Settings → Advanced Security → Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # First matching group wins - keep `framework` above the catch-all.
      framework:
        patterns: ["next", "react", "react-dom", "prisma", "@prisma/*"]
      non-major:
        patterns: ["*"]
